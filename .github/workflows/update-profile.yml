name: Update profile SVGs

on:
  schedule:
    - cron: "23 5,17 * * *"   # twice a day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/src/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVGs
        env:
          # Optional: add a classic PAT with the `read:user` scope as the
          # GH_STATS_TOKEN secret to include private contributions.
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: refresh profile stats"
          git push
